---

## Restart mongodb nodes in-turn, ensuring each node is *really* back up (i.e. a port is open) before restarting the next.
## This is an ugly way to do it, but it seems there is no alternative: 'throttle' applied to a block will apply throttle to each element of the block, so it will restart the service one-by-one, then wait for port 9200 one-by-one, which means the entire cluster will be down.  Also, 'throttle' cannot be applied to include/import_tasks.
- name: restart mongodb
  become: yes
  action:
    module: "{{ item.module }}"
  args: "{{ item.args }}"
  loop: "{{loop_vars | from_yaml }}"
  vars:
    loop_vars: |
      - module: service
        args:
          name: mongod
          state: restarted
          enabled: yes
      - module: wait_for
        args:
          host: localhost
          port: {{mongodb.mongod_conf.net.port}}
          timeout: 60

- name: restart thp-disable.service
  become: yes
  systemd:
    name: thp-disable
    state: restarted
    enabled: yes
    daemon_reload: yes

- name: restart chrony
  become: yes
  systemd:
    name: chronyd
    state: restarted
    enabled: yes
    daemon_reload: yes
