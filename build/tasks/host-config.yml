---

- name: host-config | disable transparent huge pages (for Mongo<8 only.  THP is supported in Mongo>=8)
  become: true
  copy:
    content: |
      [Unit]
      Description=Disable Transparent Huge Pages (THP)
      DefaultDependencies=no
      After=sysinit.target local-fs.target
      Before=mongod.service
      
      [Service]
      Type=oneshot
      ExecStart=/usr/bin/env sh -c "echo 'never' > /sys/kernel/mm/transparent_hugepage/enabled && echo 'never' > /sys/kernel/mm/transparent_hugepage/defrag"      

      [Install]
      WantedBy=basic.target
    dest: "/etc/systemd/system/thp-disable.service"
    force: true
  notify: restart thp-disable.service
  when: mongodb.version.split('.')[0:2] | join('.') is version('8.0', '<' )

- name: host-config | set basic sysctls
  become: true
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    reload: true
    sysctl_set: true
    state: present
  with_items:
    - {name: vm.swappiness,         value: "{{ 1 if (cluster_vars.cloud_type == 'aws' and 'swap:' in cluster_vars['user_data']) or (cluster_vars.cloud_type == 'libvirt' and 'swap' in cluster_vars['libvirt']['cloudinit_userdata']) else 0 }}"}
    - {name: vm.zone_reclaim_mode,  value: 0}
    - {name: vm.dirty_ratio,        value: 15}
    - {name: vm.dirty_background_ratio,  value: 5}
    - {name: vm.max_map_count,      value: 262144}

- name: host-config | set network sysctls
  become: true
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    reload: true
    sysctl_set: true
    state: present
  with_items:
    - {name: net.core.somaxconn,                  value: 4096}
    - {name: net.ipv4.tcp_keepalive_intvl,        value: 30}
    - {name: net.ipv4.tcp_keepalive_time,         value: 120}
    - {name: net.ipv4.tcp_keepalive_probes,       value: 6}
    - {name: net.ipv4.tcp_max_syn_backlog,        value: 4096}

- name: host-config | Add or modify hard nofile limits for mongodb and wildcard domains
  become: true
  pam_limits:
    domain: "{{item.domain}}"
    limit_type: "{{item.limit_type}}"
    limit_item: "{{item.limit_item}}"
    value: "{{item.value}}"
  with_items:
    - { domain: "*", limit_type: '-', limit_item: 'cpu', value: unlimited }
    - { domain: "*", limit_type: '-', limit_item: 'nofile', value: 65536 }
    - { domain: "*", limit_type: '-', limit_item: 'nproc', value: 192276 }
    - { domain: "*", limit_type: '-', limit_item: 'memlock', value: unlimited }
    - { domain: "*", limit_type: '-', limit_item: 'fsize', value: unlimited }
    - { domain: "*", limit_type: '-', limit_item: 'as', value: unlimited }
    - { domain: "{{mongodb.sysuser}}", limit_type: '-', limit_item: 'cpu', value: unlimited }
    - { domain: "{{mongodb.sysuser}}", limit_type: '-', limit_item: 'nofile', value: 65536 }
    - { domain: "{{mongodb.sysuser}}", limit_type: '-', limit_item: 'nproc', value: 192276 }
    - { domain: "{{mongodb.sysuser}}", limit_type: '-', limit_item: 'memlock', value: unlimited }
    - { domain: "{{mongodb.sysuser}}", limit_type: '-', limit_item: 'fsize', value: unlimited }
    - { domain: "{{mongodb.sysuser}}", limit_type: '-', limit_item: 'as', value: unlimited }

- name: host-config | enforce PAM limits
  become: true
  lineinfile:
    path: /etc/pam.d/common-session
    line: 'session required pam_limits.so'
    insertafter: EOF
