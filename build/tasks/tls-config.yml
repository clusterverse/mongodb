---

- name: mongodb-tls | host certs
  block:
    - name: mongodb-tls/host | Generate RSA private key
      community.crypto.openssl_privatekey_pipe:
        format: "pkcs8"
      register: r__openssl_privatekey_pipe
      no_log: true

    - name: mongodb-tls/host | Generate CSR
      community.crypto.openssl_csr_pipe:
        privatekey_content: "{{r__openssl_privatekey_pipe.privatekey}}"
        key_usage: ["digitalSignature", "keyEncipherment", "nonRepudiation"]
        key_usage_critical: true
        extended_key_usage: ["clientAuth", "serverAuth"]
        extended_key_usage_critical: true
        subject_ordered: [ { O: "MongoDB" } ]
        subject_alt_name: |-
          {%- set SANs = ['DNS:' + ansible_hostname,'IP:' + ansible_default_ipv4.address] -%}
          {%- if (cluster_vars.dns_user_domain is truthy) -%}
            {%- set SANs = SANs + ['DNS:' + ansible_hostname | regex_replace('-(?!.*-).*') + '.' + cluster_vars.dns_user_domain] -%}
            {%- set SANs = SANs + ['DNS:' + ansible_hostname + '.' + cluster_vars.dns_user_domain] -%}
          {%- endif -%}
          {%- if (ansible_default_ipv4.address != ansible_host) -%}
            {%- set SANs = SANs + ['IP:' + ansible_host] -%}
          {%- endif -%}
          {{ SANs }}
      register: r__openssl_csr_pipe

    - name: mongodb-tls/host | Generate the self-signed certificate
      community.crypto.x509_certificate_pipe:
        provider: ownca
        ownca_content: "{{ssl_ca['ca-crt.pem']}}"
        ownca_privatekey_content: "{{ssl_ca['ca-key.pem']}}"
        csr_content: "{{r__openssl_csr_pipe.csr}}"
        selfsigned_not_after: "+3652d"       # Expiry in 10 years (incl leap years)
      register: r__x509_certificate_pipe

#    - name: r__x509_certificate_pipe
#      debug: msg={{r__x509_certificate_pipe}}

- name: mongodb-tls | copy certs to remote
  block:
    - name: mongodb-tls | create cert directory on remote
      file: path={{mongodb.mongod_conf.net.ssl.CAFile | dirname}} state=directory owner={{mongodb.sysuser}} group={{mongodb.sysgroup}}

    - name: mongodb-tls | Copy SSL certificates to remote
      copy:
        content: "{{ item.val }}"
        dest: "{{ item.path }}"
        mode: "{{ item.mode }}"
        owner: "{{ mongodb.sysuser }}"
        group: "{{ mongodb.sysgroup }}"
        force: "{{ 'yes' if recreate_certs is defined and recreate_certs|bool else 'no' }}"
      no_log: true
      with_items:
        - { path: '{{mongodb.mongod_conf.net.ssl.CAFile}}', val: "{{ssl_ca['ca-crt.pem']}}", mode: '0600' }
        - { path: '{{mongodb.mongod_conf.net.ssl.PEMKeyFile}}', val: "{{r__x509_certificate_pipe.certificate}}\n\n{{r__openssl_privatekey_pipe.privatekey}}", mode: '0600' }
  become: true
  notify: restart mongodb
