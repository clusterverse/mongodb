---

- name: mongodb | configure ssl for replicaset
  include_tasks:
    file: ssl_ownca.yml

- name: mongodb | configure the host VM
  include_tasks:
    file: host-config.yml

- name: mongodb | install the binary
  include_tasks:
    file: binary-install.yml

- name: mongodb | configure mongodb
  include_tasks:
