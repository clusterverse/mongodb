---

- name: replicaset | groups['mongodb']
  debug: msg="{{ groups['mongodb'] | map('regex_replace', '^(.*)$', '\\1' + '.' + cluster_vars.dns_user_domain + ':' +  mongodb.mongod_conf.net.port|string) | sort }}"

- name: replicaset | check existence and create if needed
  block:
    - name: replicaset | get repset status
      community.mongodb.mongodb_shell:
        mongo_cmd: auto
        eval: "rs.status()"
        stringify: true
      any_errors_fatal: true
      failed_when: "r__mongodb_shell__status.failed  and  r__mongodb_shell__status.msg is not regex('no replset config has been received')"
      register: r__mongodb_shell__status

    - name: replicaset | r__mongodb_shell__status (before create replicaset)
      debug: { msg: "{{ r__mongodb_shell__status }}" }

    - name: replicaset | initialise/create replicaset (we set reconfigure true when the cluster already exists, so that redeploys are handled.  Need to set validate false because the module thinks only 2 replicas are valid)
      community.mongodb.mongodb_replicaset:
        cluster_cmd: "{{'isMaster' if (mongodb.version.split('.')[0:2] | join('.') is version('3.4', '<=' )) else omit}}"    # isMaster is replaced by 'hello' after 3.4
        replica_set: "{{mongodb.mongod_conf.replication.replSetName}}"
        members: "{{ groups['mongodb'] | map('regex_replace', '^(.*)$', '\\1' + '.' + cluster_vars.dns_user_domain + ':' +  mongodb.mongod_conf.net.port|string) | sort }}"
        debug: true
        reconfigure: "{{'false' if  r__mongodb_shell__status.msg is regex('no replset config has been received') else 'true'}}"
        validate: false
      register: r__mongodb_replicaset
      retries: 3
      until: r__mongodb_replicaset is success

    - name: replicaset | debug r__mongodb_replicaset
      debug: msg="{{r__mongodb_replicaset}}"

    - name: replicaset | Wait for converged status [All members must be in state of PRIMARY,SECONDARY, or ARBITER; One of the members must be in state PRIMARY].  (We can't use community.mongodb.mongodb_status with MongoDB <=3.4)
      community.mongodb.mongodb_shell:
        mongo_cmd: auto
        eval: "rs.status()"
        stringify: true
      register: r__mongodb_shell__status
      any_errors_fatal: true
      changed_when: false
      retries: 10
      until: >
        r__mongodb_shell__status | json_query('transformed_output.members[?health==`0` || !(contains(`PRIMARY,SECONDARY,ARBITER` stateStr))]') | length==0 and
        r__mongodb_shell__status | json_query('transformed_output.members[?stateStr==`PRIMARY`]') | length==1 

    - name: replicaset | r__mongodb_shell__status (after create replicaset)
      debug: { msg: "{{r__mongodb_shell__status | json_query('transformed_output.members[].{name: name, stateStr: stateStr, state: state, health: health}') | sort(attribute='name')}}" }

#    - name: replicaset | get repset status
#      community.mongodb.mongodb_status:
#        replica_set: "{{mongodb.mongod_conf.replication.replSetName}}"
#        strict_compatibility: false
#      register: r__mongodb_status
#      retries: 10      # Can't use poll/interval until https://github.com/ansible-collections/community.mongodb/pull/657 is in mainline.  Use retries/until in the meantime.
#      until: r__mongodb_status is success

#    - name: replicaset | debug r__mongodb_status
#      debug: msg="{{r__mongodb_status}}"
  become: true
  delegate_to: "{{ (groups['mongodb'] | sort())[0] }}"
  run_once: true
