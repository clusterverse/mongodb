---

## Restart mongodb nodes serially in-turn, ensuring each node is *really* back up (i.e. ports are open) before restarting the next (ensures zero-downtime).
## This custom action plugin is a compromise, but there is apparently no alternative; see https://github.com/ansible/ansible/issues/80374
- name: restart mongodb
  become: true
  dseeley.tasks_serial.tasks_serial:
    tasks:
      - name: ansible.builtin.service
        args:
          name: mongod
          state: restarted
          enabled: true
      - name: ansible.builtin.wait_for
        args:
          host: localhost
          port: "{{mongodb.mongod_conf.net.port}}"
          timeout: 60
      - name: ansible.builtin.wait_for
        args:
          timeout: 20
  throttle: 1

- name: restart thp-disable.service
  become: true
  systemd:
    name: thp-disable
    state: restarted
    enabled: true
    daemon_reload: true
