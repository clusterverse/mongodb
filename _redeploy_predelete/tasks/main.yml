---

## Note: By the time we get here:
##  + _scheme_addnewvm_rmdisk_rollback:     We have added the new replica to the cluster and waited for it to converge.
##  + _scheme_rmvm_[rm|keep]disk_rollback:  We have done nothing, except confirm the cluster is converged.
##  In all cases, we can remove the hosts_to_remove.  However, we must ensure that the primary is not removed until the non-primary members have been removed.  We also cannot step-down the primary until all the secondaries have been removed, otherwise we may step-down to a secondary that is about to be removed.
##  This playbook technically can process multiple hosts_to_remove (if the force parameter is set), but doing so is not recommended as it might lead to committed writes being rolled back.

- name: mongodb/redeploy_predelete | debug hosts_to_remove
  debug: msg="{{ hosts_to_remove }}"

- name: mongodb/redeploy_predelete | remove non-primary hosts_to_remove from the replicaset
  block:
    - name: mongodb/redeploy_predelete | get repset status from the hosts_to_remove (we know it should be a valid member)
      community.mongodb.mongodb_shell:
        login_user: "admin"
        login_password: "{{mongodb.admin_password}}"
        mongo_cmd: auto
        debug: true
        stringify: true
        eval: "rs.status()"
      changed_when: false
      ignore_errors: true
      failed_when: "r__mongodb_shell__status_initial.failed  and  r__mongodb_shell__status_initial.msg is not regex('no replset config has been received')"
      register: r__mongodb_shell__status_initial
      delegate_to: "{{ (hosts_to_remove | json_query(\"[].name\") | default(['_dummy']))[0] }}"

    - name: mongodb/redeploy_predelete | debug r__mongodb_shell__status_initial
      debug: {msg: "{{ r__mongodb_shell__status_initial }}"}

    - name: mongodb/redeploy_predelete | debug mongod_status_initial_primary
      debug: {msg: "{{mongod_status_initial_primary}}"}

    - name: mongodb/redeploy_predelete | debug mongod_status_initial_primary_hostname
      debug: {msg: "{{mongod_status_initial_primary_hostname}}"}

    - name: mongodb/redeploy_predelete | debug mongod_status_initial_nodes
      debug: msg="{{ mongod_status_initial_nodes }}"

    - name: mongodb/redeploy_predelete | debug mongodb_nodes_to_keep
      debug: msg="{{ mongodb_nodes_to_keep }}"

    - name: mongodb/redeploy_predelete | debug hosts_to_keep
      debug: msg="{{ hosts_to_keep }}"

    - name: mongodb/redeploy_predelete | Remove non-primaries from the replicaset
      block:
        - name: mongodb/redeploy_predelete | debug hosts_to_remove__non_primary
          debug: {msg: "{{hosts_to_remove__non_primary}}"}

        - name: mongodb/redeploy_predelete | remove hosts_to_remove__non_primary from the replicaset.  Need to use community.mongodb.mongodb_shell for Mongo3.4.
          community.mongodb.mongodb_shell:
            login_user: "admin"
            login_password: "{{mongodb.admin_password}}"
            mongo_cmd: auto
            debug: true
            stringify: false
            eval: |-
              try {
                var status = rs.status();
              } catch (e) {
                var status = { ok: 0 };
              }
              var members = {{ (((hosts_to_keep | default([]) | union([mongod_status_initial_primary_hostname])) | map('extract', hostvars, ['ansible_host'])) if (cluster_vars.dns_user_domain is falsy)  else  hosts_to_keep | default([]) | union([mongod_status_initial_primary_hostname]) | map('regex_replace', '^(.*)$', '\1' + '.' + cluster_vars.dns_user_domain)) | map('regex_replace', '^(.*)$', '\1' + ':' + mongodb.mongod_conf.net.port|string) | sort }};

              function createMemberConfig(members, currentMembers) {
                var memberConfig = [];
                var currentIds = currentMembers.map(cm => cm._id);
                var maxId = Math.max.apply(null, currentIds.concat(-1)); // Get the max _id, or -1 if no members
                members.forEach((member) => {
                  var existingMember = currentMembers.find(cm => cm.host === member);
                  if (existingMember) {
                    memberConfig.push({ _id: existingMember._id, host: member });
                  } else {
                    memberConfig.push({ _id: ++maxId, host: member });
                  }
                });
                return memberConfig;
              }

              if (status.ok !== 1) {
                rs.initiate({
                  _id: "{{ mongodb.mongod_conf.replication.replSetName }}",
                  protocolVersion: 1,
                  members: createMemberConfig(members, [])
                });
              } else {
                var currentMembers = status.members.map(member => ({ _id: member._id, host: member.name })).sort((a, b) => a._id - b._id);
                var newConfig = createMemberConfig(members, currentMembers);
                var currentHosts = currentMembers.map(member => member.host).sort();
                var newHosts = members.sort();
                if (JSON.stringify(currentHosts) !== JSON.stringify(newHosts)) {
                  rs.reconfig({
                    _id: "{{ mongodb.mongod_conf.replication.replSetName }}",
                    protocolVersion: 1,
                    members: newConfig
                  }, { force: {{'true' if (hosts_to_remove__non_primary | length > 1) else 'false'}} });
                }
              }
          delegate_to: "{{ mongod_status_initial_primary_hostname }}"
          register: r__mongodb_replicaset
          when: mongodb.version.split('.')[0:2] | join('.') is version('4.0', '<=' )    # NOTE: whilst v3.6 is supports mongodb_replicaset, if we're doing a redeploy to v3.6, we'll also be running this on v3.4 nodes.

          ## Note: Not supported on MongoDB 3.4
        - name: mongodb/redeploy_predelete | remove hosts_to_remove__non_primary from the replicaset
          community.mongodb.mongodb_replicaset:
            login_user: "admin"
            login_password: "{{mongodb.admin_password}}"
            replica_set: "{{mongodb.mongod_conf.replication.replSetName}}"
            members: "{{ (((hosts_to_keep | default([]) | union([mongod_status_initial_primary_hostname])) | map('extract', hostvars, ['ansible_host'])) if (cluster_vars.dns_user_domain is falsy)  else  hosts_to_keep | default([]) | union([mongod_status_initial_primary_hostname]) | map('regex_replace', '^(.*)$', '\\1' + '.' + cluster_vars.dns_user_domain)) | map('regex_replace', '^(.*)$', '\\1' + ':' + mongodb.mongod_conf.net.port|string) | sort }}"
            reconfigure: true
            force: "{{'true' if (hosts_to_remove__non_primary | length > 1) else 'false'}}"
            validate: false
          delegate_to: "{{ mongod_status_initial_primary_hostname }}"
          register: r__mongodb_replicaset
          when: mongodb.version.split('.')[0:2] | join('.') is version('4.0', '>' )    # NOTE: whilst v3.6 is supports mongodb_replicaset, if we're doing a redeploy to v3.6, we'll also be running this on v3.4 nodes.

        - name: mongodb/redeploy_predelete | debug r__mongodb_replicaset (after remove non-primaries)
          debug: {msg: "{{r__mongodb_replicaset}}"}

        - name: mongodb/redeploy_predelete | Wait for converged status [All members must be in state of PRIMARY,SECONDARY, or ARBITER; One of the members must be in state PRIMARY].  (We can't use community.mongodb.mongodb_status with MongoDB <=3.4)
          community.mongodb.mongodb_shell:
            login_user: "admin"
            login_password: "{{mongodb.admin_password}}"
            mongo_cmd: auto
            debug: true
            stringify: true
            eval: "rs.status()"
          register: r__mongodb_shell__status
          any_errors_fatal: true
          changed_when: false
          delegate_to: "{{ mongod_status_initial_primary_hostname }}"
          retries: 10
          until: >
            r__mongodb_shell__status | json_query('transformed_output.members[?health==`0` || !(contains(`PRIMARY,SECONDARY,ARBITER` stateStr))]') | length==0 and
            r__mongodb_shell__status | json_query('transformed_output.members[?stateStr==`PRIMARY`]') | length==1

        - name: mongodb/redeploy_predelete | debug r__mongodb_shell__status (after removing hosts_to_remove__non_primary from the replicaset)
          debug: {msg: "{{r__mongodb_shell__status | json_query('transformed_output.members[].{name: name, stateStr: stateStr, state: state, health: health}') | sort(attribute='name')}}"}

        - name: "mongodb/redeploy_predelete | shut down hosts_to_remove__non_primary (don't use mongodb_shutdown or shell eval db.shutdownServer({timeoutSecs: 60}))"
          become: true
          service: {name: mongod, state: stopped}
          delegate_to: "{{item}}"
          loop: "{{hosts_to_remove__non_primary}}"
      vars:
        hosts_to_remove__non_primary: "{{ (hosts_to_remove | default([]) | json_query(\"[].name\")) | difference([mongod_status_initial_primary_hostname]) | sort }}"
      when: hosts_to_remove__non_primary | length > 0

    - name: mongodb/redeploy_predelete | remove the primary (if it's in hosts_to_remove), if this is a replicaset, otherwise just shut it down.
      block:
        - name: mongodb/redeploy_predelete | remove primary from the replicaset if this is a replicaset
          block:
            - name: mongodb/redeploy_predelete | If we're now removing the primary, then we need to step it down first.  We cannot test for failure here, because it always fails (it drops connection after stepping down) [https://mongodb-user.narkive.com/G1m2XoxR/error-while-trying-to-stepdown-mongodb-replica-set].
              community.mongodb.mongodb_shell:
                login_user: "admin"
                login_password: "{{mongodb.admin_password}}"
                mongo_cmd: auto
                debug: true
                stringify: true
                eval: "rs.stepDown()"
              register: r__mongodb_stepdown
              ignore_errors: true
              delegate_to: "{{ mongod_status_initial_primary_hostname }}"
              when: mongodb.version.split('.')[0:2] | join('.') is version('4.0', '<=' )    # NOTE: whilst v3.6 is supports mongodb_replicaset, if we're doing a redeploy to v3.6, we'll also be running this on v3.4 nodes.

              ## NOTE: mongodb_stepdown is not valid for MongoDB 3.4, need to use mongodb_shell.
            - name: mongodb/redeploy_predelete | If we're now removing the primary, then we need to step it down first
              community.mongodb.mongodb_stepdown:
                login_user: "admin"
                login_password: "{{mongodb.admin_password}}"
                strict_compatibility: false
              register: r__mongodb_stepdown
              until: r__mongodb_stepdown is success
              retries: 10      # Can't use poll/interval until https://github.com/ansible-collections/community.mongodb/pull/657 is in mainline.  Use retries/until in the meantime.
              delegate_to: "{{ mongod_status_initial_primary_hostname }}"
              when: mongodb.version.split('.')[0:2] | join('.') is version('4.0', '>' )    # NOTE: whilst v3.6 is supports mongodb_replicaset, if we're doing a redeploy to v3.6, we'll also be running this on v3.4 nodes.

            - name: mongodb/redeploy_predelete | debug r__mongodb_stepdown (after stepping down primary)
              debug: {msg: "{{r__mongodb_stepdown}}"}

            - name: mongodb/redeploy_predelete | Wait for converged status (after stepping down primary) [All members must be in state of PRIMARY,SECONDARY, or ARBITER; One of the members must be in state PRIMARY].  (We can't use community.mongodb.mongodb_status with MongoDB <=3.4)
              become: true
              community.mongodb.mongodb_shell:
                login_user: "admin"
                login_password: "{{mongodb.admin_password}}"
                mongo_cmd: auto
                debug: true
                stringify: true
                eval: "rs.status()"
              register: r__mongodb_shell__status_after_remove_primary
              any_errors_fatal: true
              changed_when: false
              delegate_to: "{{ hosts_to_keep[0] | default('_dummy') }}"
              retries: 10
              until: >
                r__mongodb_shell__status_after_remove_primary | json_query('transformed_output.members[?health==`0` || !(contains(`PRIMARY,SECONDARY,ARBITER` stateStr))]') | length==0 and
                r__mongodb_shell__status_after_remove_primary | json_query('transformed_output.members[?stateStr==`PRIMARY`]') | length==1

            - name: mongodb/redeploy_predelete | get the new primary node
              community.mongodb.mongodb_shell:
                login_user: "admin"
                login_password: "{{mongodb.admin_password}}"
                mongo_cmd: auto
                debug: true
                stringify: false
                transform: raw
                eval: "rs.status().members.find(r=>r.state===1).name"
              changed_when: false
              retries: 2        # The primary may not be ready to accept connections immediately after the replicaset is created
              register: r__mongo__primary_new
              delegate_to: "{{ hosts_to_keep[0] | default('_dummy') }}"

            - block:
                - name: mongodb/redeploy_predelete | debug r__mongo__primary_new (new primary node)
                  debug: {msg: "{{r__mongo__primary_new}}"}

                - name: mongodb/redeploy_predelete | remove previous primary from the replicaset (must be run on the *new* primary).  Need to use community.mongodb.mongodb_shell for Mongo3.4.
                  community.mongodb.mongodb_shell:
                    login_user: "admin"
                    login_password: "{{mongodb.admin_password}}"
                    mongo_cmd: auto
                    debug: true
                    stringify: false
                    eval: |-
                      try {
                        var status = rs.status();
                      } catch (e) {
                        var status = { ok: 0 };
                      }
                      var members = {{ mongodb_nodes_to_keep }};
        
                      function createMemberConfig(members, currentMembers) {
                        var memberConfig = [];
                        var currentIds = currentMembers.map(cm => cm._id);
                        var maxId = Math.max.apply(null, currentIds.concat(-1)); // Get the max _id, or -1 if no members
                        members.forEach((member) => {
                          var existingMember = currentMembers.find(cm => cm.host === member);
                          if (existingMember) {
                            memberConfig.push({ _id: existingMember._id, host: member });
                          } else {
                            memberConfig.push({ _id: ++maxId, host: member });
                          }
                        });
                        return memberConfig;
                      }
        
                      if (status.ok !== 1) {
                        rs.initiate({
                          _id: "{{ mongodb.mongod_conf.replication.replSetName }}",
                          protocolVersion: 1,
                          members: createMemberConfig(members, [])
                        });
                      } else {
                        var currentMembers = status.members.map(member => ({ _id: member._id, host: member.name })).sort((a, b) => a._id - b._id);
                        var newConfig = createMemberConfig(members, currentMembers);
                        var currentHosts = currentMembers.map(member => member.host).sort();
                        var newHosts = members.sort();
                        if (JSON.stringify(currentHosts) !== JSON.stringify(newHosts)) {
                          rs.reconfig({
                            _id: "{{ mongodb.mongod_conf.replication.replSetName }}",
                            protocolVersion: 1,
                            members: newConfig
                          });
                        }
                      }
                  delegate_to: "{{ mongod_status_new_primary_hostname | default('_dummy') }}"
                  register: r__mongodb_replicaset
#                  when: mongodb.version.split('.')[0:2] | join('.') is version('4.0', '<=' )    # NOTE: whilst v3.6 is supports mongodb_replicaset, if we're doing a redeploy to v3.6, we'll also be running this on v3.4 nodes.
#
#                  ## NOTE: Not supported on MongoDB 3.4
#                - name: mongodb/redeploy_predelete | remove previous primary from the replicaset (must be run on the *new* primary)
#                  become: true
#                  community.mongodb.mongodb_replicaset:
#                    login_user: "admin"
#                    login_password: "{{mongodb.admin_password}}"
#                    replica_set: "{{mongodb.mongod_conf.replication.replSetName}}"
#                    members: "{{ mongodb_nodes_to_keep }}"
#                    reconfigure: true
#                    validate: false
#                  delegate_to: "{{ mongod_status_new_primary_hostname | default('_dummy') }}"
#                  register: r__mongodb_replicaset
#                  when: mongodb.version.split('.')[0:2] | join('.') is version('4.0', '>' )    # NOTE: whilst v3.6 is supports mongodb_replicaset, if we're doing a redeploy to v3.6, we'll also be running this on v3.4 nodes.

                - name: mongodb/redeploy_predelete | debug r__mongodb_replicaset (after remove primary)
                  debug: {msg: "{{r__mongodb_replicaset}}"}
              vars:
                mongod_status_new_primary_hostname: "{% if r__mongo__primary_new.transformed_output is match('^\\d+\\.\\d+\\.\\d+\\.\\d+') %}{{ groups['all'] | map('extract', hostvars) | selectattr('ansible_host', 'defined') | selectattr('ansible_host', 'equalto', r__mongo__primary_new.transformed_output.split(':')[0] ) | map(attribute='inventory_hostname') | first }}{% else %}{{ r__mongo__primary_new.transformed_output.split('.')[0] }}{% endif %}"


            - name: mongodb/redeploy_predelete | Wait for converged status (after remove primary) [All members must be in state of PRIMARY,SECONDARY, or ARBITER; One of the members must be in state PRIMARY].  (We can't use community.mongodb.mongodb_status with MongoDB <=3.4)
              become: true
              community.mongodb.mongodb_shell:
                login_user: "admin"
                login_password: "{{mongodb.admin_password}}"
                mongo_cmd: auto
                debug: true
                stringify: true
                eval: "rs.status()"
              register: r__mongodb_shell__status_after_remove_primary
              any_errors_fatal: true
              changed_when: false
              delegate_to: "{{ hosts_to_keep[0] | default('_dummy') }}"
              retries: 10
              until: >
                r__mongodb_shell__status_after_remove_primary | json_query('transformed_output.members[?health==`0` || !(contains(`PRIMARY,SECONDARY,ARBITER` stateStr))]') | length==0 and
                r__mongodb_shell__status_after_remove_primary | json_query('transformed_output.members[?stateStr==`PRIMARY`]') | length==1

            - name: mongodb/redeploy_predelete | debug r__mongodb_shell__status_after_remove_primary (after removing previous primary from the replicaset)
              debug: {msg: "{{r__mongodb_shell__status_after_remove_primary | json_query('transformed_output.members[].{name: name, stateStr: stateStr, state: state, health: health}') | sort(attribute='name')}}"}
          when: mongod_status_initial_nodes | length > 1

        - name: "mongodb/redeploy_predelete | shut down mongod_status_initial_primary_hostname (don't use mongodb_shutdown or shell eval db.shutdownServer({timeoutSecs: 60}) - these have issues with the shutdown causing the Mongo connection to fail)"
          become: true
          service: {name: mongod, state: stopped}
          delegate_to: "{{mongod_status_initial_primary_hostname}}"
      when: mongod_status_initial_primary_hostname in (hosts_to_remove | default([]) | json_query('[].name'))
  vars:
    mongod_status_initial_primary: "{{ (r__mongodb_shell__status_initial | default([]) | json_query(\"transformed_output.members[?stateStr==`PRIMARY`].name\"))[0] }}"
    mongod_status_initial_primary_hostname: "{% if mongod_status_initial_primary is match('^\\d+\\.\\d+\\.\\d+\\.\\d+') %}{{ groups['all'] | map('extract', hostvars) | selectattr('ansible_host', 'defined') | selectattr('ansible_host', 'equalto', mongod_status_initial_primary.split(':')[0] ) | map(attribute='inventory_hostname') | first }}{% else %}{{ mongod_status_initial_primary.split('.')[0] }}{% endif %}"
    mongod_status_initial_nodes: "{{ r__mongodb_shell__status_initial | json_query('transformed_output.members[].name') }}"
    mongodb_nodes_to_keep: |
      {%- if mongod_status_initial_primary is match('^\\d+\\.\\d+\\.\\d+\\.\\d+') -%}
        {{ ( (groups['all'] | map('extract', hostvars) | selectattr('ansible_host', 'defined') | selectattr('ansible_host', 'in', mongod_status_initial_nodes | map('regex_replace', ':.*$') ) | map(attribute='inventory_hostname')) | difference(hosts_to_remove | default([]) | json_query('[].name') ) | map('extract', hostvars) | map(attribute='ansible_host')  | map('regex_replace', '^(.*)$', '\1' + ':' +  mongodb.mongod_conf.net.port|string) ) | sort }}
      {%- else -%}
        {{ mongod_status_initial_nodes | difference(hosts_to_remove | default([]) | json_query('[].name') | map('regex_replace', '^(.*)$', '\1' + '.' + cluster_vars.dns_user_domain + ':' +  mongodb.mongod_conf.net.port|string)) | sort }}
      {%- endif -%}
    hosts_to_keep: "{%- if mongod_status_initial_primary is match('^\\d+\\.\\d+\\.\\d+\\.\\d+') -%}{{ (groups['all'] | map('extract', hostvars) | selectattr('ansible_host', 'defined') | selectattr('ansible_host', 'in', mongodb_nodes_to_keep | map('regex_replace', ':.*$') ) | map(attribute='inventory_hostname')) }}{% else %}{{ mongodb_nodes_to_keep | map('regex_replace', '\\..*$') }}{% endif %}"
  when: hosts_to_remove | length > 0