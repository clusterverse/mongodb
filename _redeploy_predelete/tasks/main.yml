---

## Note: By the time we get here, we have added new replicas to the cluster and waited for it to converge.  We are safe to remove all 'hosts_to_remove' simultaneously.
##       However, we must ensure that the primary is not removed until the non-primary members have been removed.  We also cannot step-down the primary until all the secondaries have been removed, otherwise we may step-down to a secondary that is about to be removed.

- name: mongodb/redeploy_predelete | debug hosts_to_remove
  debug: msg="{{hosts_to_remove | default([])}}"

- name: mongodb/redeploy_predelete | debug groups['mongodb']
  debug: msg="{{ groups['mongodb'] | sort() }}"

- block:
    - name: mongodb/redeploy_predelete | debug hosts_to_keep
      debug: msg="{{ hosts_to_keep }}"

    - name: mongodb/redeploy_predelete | Get the initial PRIMARY node
      become: true
      community.mongodb.mongodb_shell:
        mongo_cmd: auto
        eval: "rs.status().members.find(r=>r.state===1).name"
        transform: raw
        stringify: false
      register: r__mongo__primary_initial
      delegate_to: "{{ hosts_to_keep[0] }}"
      run_once: true

    - name: mongodb/redeploy_predelete | debug initial PRIMARY node
      debug: { msg: "{{r__mongo__primary_initial}}" }
      run_once: true

    - name: mongodb/redeploy_predelete | Remove non-primaries from the replicaset
      block:
        - name: mongodb/redeploy_predelete | debug non_primaries_to_remove
          debug: { msg: "{{non_primaries_to_remove}}" }

        - name: mongodb/redeploy_predelete | shut down non_primaries_to_remove
          become: true
          community.mongodb.mongodb_shutdown:
            timeout: 60
          delegate_to: "{{item}}"
          loop: "{{non_primaries_to_remove}}"

        - name: mongodb/redeploy_predelete | Stop mongod service
          become: true
          service: {name: mongod, state: stopped}

        - name: mongodb/redeploy_predelete | remove non_primaries_to_remove from the replicaset
          become: true
          community.mongodb.mongodb_replicaset:
            cluster_cmd: "{{'isMaster' if (mongodb.version.split('.')[0:2] | join('.') is version('3.4', '<=' )) else omit}}"    # isMaster is replaced by 'hello' after 3.4
            replica_set: "{{mongodb.mongod_conf.replication.replSetName}}"
            members: "{{ hosts_to_keep | default([]) | difference(primary_host_initial) | map('regex_replace', '^(.*)$', '\\1' + '.' + cluster_vars.dns_user_domain + ':' +  mongodb.mongod_conf.net.port|string) | sort }}"
            debug: true
            reconfigure: true
            validate: false
          delegate_to: "{{ primary_host_initial }}"
          register: r__mongodb_replicaset

        - name: mongodb/redeploy_predelete | debug r__mongodb_replicaset (after remove non-primaries)
          debug: { msg: "{{r__mongodb_replicaset}}" }

        - name: mongodb/redeploy_predelete | Wait for converged status [All members must be in state of PRIMARY,SECONDARY, or ARBITER; One of the members must be in state PRIMARY].  (We can't use community.mongodb.mongodb_status with MongoDB <=3.4)
          become: true
          community.mongodb.mongodb_shell:
            mongo_cmd: auto
            eval: "rs.status()"
            stringify: true
          register: r__mongodb_shell__status
          any_errors_fatal: true
          changed_when: false
          delegate_to: "{{ primary_host_initial }}"
          retries: 10
          until: >
            r__mongodb_shell__status | json_query('transformed_output.members[?health==`0` || !(contains(`PRIMARY,SECONDARY,ARBITER` stateStr))]') | length==0 and
            r__mongodb_shell__status | json_query('transformed_output.members[?stateStr==`PRIMARY`]') | length==1

        - name: mongodb/redeploy_predelete | r__mongodb_shell__status (after create replicaset)
          debug: { msg: "{{r__mongodb_shell__status | json_query('transformed_output.members[].{name: name, stateStr: stateStr, state: state, health: health}') | sort(attribute='name')}}" }
      vars:
        non_primaries_to_remove: "{{ hosts_to_remove | default([]) | json_query(\"[].name\") | map('regex_replace', '^(.*)$', '\\1' + '.' + cluster_vars.dns_user_domain + ':' +  mongodb.mongod_conf.net.port|string) | sort | difference([r__mongo__primary_initial.transformed_output]) }}"
      when: non_primaries_to_remove | length > 0

    - name: mongodb/redeploy_predelete | remove the primary (if it's in hosts_to_remove)
      block:
        - name: mongodb/redeploy_predelete | debug primary_host_initial
          debug: { msg: "{{primary_host_initial}}" }

        - name: mongodb/redeploy_predelete | If we're now removing the primary, then we need to step it down first
          become: true
          community.mongodb.mongodb_stepdown:
            strict_compatibility: false
          register: r__mongodb_stepdown
          until: r__mongodb_stepdown is success
          retries: 10      # Can't use poll/interval until https://github.com/ansible-collections/community.mongodb/pull/657 is in mainline.  Use retries/until in the meantime.
          delegate_to: "{{ primary_host_initial }}"

        - name: mongodb/redeploy_predelete | get the new PRIMARY node
          become: true
          community.mongodb.mongodb_shell:
            mongo_cmd: auto
            eval: "rs.status().members.find(r=>r.state===1).name"
            transform: raw
            stringify: false
          register: r__mongo__primary_new
          delegate_to: "{{ hosts_to_keep[0] }}"
          run_once: true
    
        - name: mongodb/redeploy_predelete | debug new PRIMARY node
          debug: { msg: "{{r__mongo__primary_new}}" }
          run_once: true

        - name: mongodb/redeploy_predelete | remove previous primary from the replicaset
          become: true
          community.mongodb.mongodb_replicaset:
            cluster_cmd: "{{'isMaster' if (mongodb.version.split('.')[0:2] | join('.') is version('3.4', '<=' )) else omit}}"    # isMaster is replaced by 'hello' after 3.4
            replica_set: "{{mongodb.mongod_conf.replication.replSetName}}"
            members: "{{ hosts_to_keep | default([]) | map('regex_replace', '^(.*)$', '\\1' + '.' + cluster_vars.dns_user_domain + ':' +  mongodb.mongod_conf.net.port|string) | sort }}"
            debug: true
            reconfigure: true
            validate: false
          delegate_to: "{{ r__mongo__primary_new.transformed_output.split('.')[0] }}"
          register: r__mongodb_replicaset

        - name: mongodb/redeploy_predelete | debug r__mongodb_replicaset (after remove primary)
          debug: { msg: "{{r__mongodb_replicaset}}" }

        - name: mongodb/redeploy_predelete | Wait for converged status [All members must be in state of PRIMARY,SECONDARY, or ARBITER; One of the members must be in state PRIMARY].  (We can't use community.mongodb.mongodb_status with MongoDB <=3.4)
          become: true
          community.mongodb.mongodb_shell:
            mongo_cmd: auto
            eval: "rs.status()"
            stringify: true
          register: r__mongodb_shell__status
          any_errors_fatal: true
          changed_when: false
          delegate_to: "{{ hosts_to_keep[0] }}"
          retries: 10
          until: >
            r__mongodb_shell__status | json_query('transformed_output.members[?health==`0` || !(contains(`PRIMARY,SECONDARY,ARBITER` stateStr))]') | length==0 and
            r__mongodb_shell__status | json_query('transformed_output.members[?stateStr==`PRIMARY`]') | length==1

        - name: mongodb/redeploy_predelete | r__mongodb_shell__status (after create replicaset)
          debug: { msg: "{{r__mongodb_shell__status | json_query('transformed_output.members[].{name: name, stateStr: stateStr, state: state, health: health}') | sort(attribute='name')}}" }
      when: primary_host_initial in (hosts_to_remove | default([]) | map(attribute='name'))
  vars:
    primary_host_initial: "{{ r__mongo__primary_initial.transformed_output.split('.')[0] }}"
    hosts_to_keep: "{{ groups['mongodb'] | difference(hosts_to_remove | default([]) | map(attribute='name')) }}"
