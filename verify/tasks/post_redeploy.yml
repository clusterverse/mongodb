---

- name: verify/post | Verify with test user and data
  block:
    - name: verify/post | verify test data
      command: python3 /tmp/verify_data.py
      register: r__verify_data

    - name: verify/post | debug r__verify_data
      debug: {msg: "{{r__verify_data.stdout}}"}

    - name: verify/post | delete minimum user for testing (MongoDB 3.4)
      community.mongodb.mongodb_shell:
        login_user: "admin"
        login_password: "{{mongodb.admin_password}}"
        mongo_cmd: auto
        debug: true
        stringify: true
        db: "_redeploy_test"
        eval: "db.dropUser( '_redeploy_test' )"
      delegate_to: "{{ mongod_status_primary_hostname }}"
      register: test_dropUser
      when: mongodb.version.split('.')[0:2] | join('.') is version('4.0', '<=' )    # NOTE: whilst v3.6 is supports mongodb_replicaset, if we're doing a redeploy to v3.6, we'll also be running this on v3.4 nodes.

    - name: verify/post | delete minimum user for testing (MongoDB >3.4)
      community.mongodb.mongodb_user:
        login_user: "admin"
        login_password: "{{mongodb.admin_password}}"
        database: "_redeploy_test"
        replica_set: "{{mongodb.mongod_conf.replication.replSetName}}"
        user: "_redeploy_test"
        state: absent
      delegate_to: "{{ mongod_status_primary_hostname }}"
      register: test_dropUser
      when: mongodb.version.split('.')[0:2] | join('.') is version('4.0', '>' )    # NOTE: whilst v3.6 is supports mongodb_replicaset, if we're doing a redeploy to v3.6, we'll also be running this on v3.4 nodes.

    - name: verify/post | drop _redeploy_test database
      community.mongodb.mongodb_shell:
        login_user: "admin"
        login_password: "{{mongodb.admin_password}}"
        mongo_cmd: auto
        debug: true
        stringify: true
        db: "_redeploy_test"
        eval: "db.dropDatabase()"
      delegate_to: "{{ mongod_status_primary_hostname }}"
      register: test_dropUser
